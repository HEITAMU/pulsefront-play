<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060b18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="单指开火，守住最后的防线。三面来敌、波状攻击、踩拍波峰与100个渐进关卡。"><title>脉冲防线 · PULSEFRONT</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=tutorial1">
</head>
<body>
<main id="app" aria-label="脉冲防线游戏">
<canvas id="space" aria-label="太空战场"></canvas>
<div class="vignette"></div>
<header class="topbar"><a class="brand" href="#" id="brand" aria-label="打开游戏菜单"><span class="brand-icon">P</span><span>PULSE<span class="muted">FRONT</span><small>脉冲防线</small></span></a><div class="top-actions"><button class="icon-button" id="sound" aria-label="关闭声音" title="声音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15 8q5 4 0 8m3-11q8 7 0 14"/></svg></button><button class="icon-button" id="pause" aria-label="暂停游戏" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button class="icon-button" id="settings" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></div></header>
<section id="hud" hidden aria-label="战斗信息"><div class="flight-capsule"><div class="level-title"><span id="zone" hidden>曙光边境</span><small>SECTOR</small><strong><span id="level-num">01</span><em>/100</em></strong></div><div class="flight-clock"><span id="stage-time" aria-label="本关剩余时间">65s</span><div class="stage-progress"><i id="stage-fill"></i></div></div><div class="shield-row"><span class="shield-label" aria-label="护盾">◈</span><div class="shield-track"><i id="shield-fill"></i></div><b id="hp">100</b></div></div><div class="score-block" hidden><strong id="score">000000</strong></div><div class="track-strip" hidden><span id="track-name"></span><b id="track-genre"></b></div><div id="boss-hud" hidden><div><span>首领</span><b id="boss-percent">100%</b></div><div class="boss-track"><i id="boss-fill"></i></div></div></section>
<div id="battle-banner" aria-live="polite"></div><div id="combo" hidden><strong>0</strong><span>连击</span></div>
<section id="home" class="home screen">
 <div class="home-hero"><div class="home-wallet">✧ <b id="wallet-value">0</b></div><div class="title-lockup"><p>RHYTHM BEYOND THE VOID</p><h1>脉冲<br><span>防线<span class="title-dot">.</span></span></h1><div class="title-en">随节拍，点燃星海。</div></div></div>
 <div class="home-dock">
  <section class="home-zone campaign-zone" aria-label="出击区域"><button id="start" class="primary"><span id="start-label">开始出击</span><span class="arrow">↗</span></button><button id="levels" class="map-entry">星域地图 <span>选择已解锁关卡 ↗</span></button></section>
  <section class="home-zone" aria-label="武器养成"><div class="home-section-label">武器养成</div><div class="home-upgrades"><button id="support-home" class="home-tile"><span class="tile-symbol">✦</span><span><strong>副武器</strong><small>装配与飞行动作</small></span><b>↗</b></button><button id="growth-home" class="home-tile"><span class="tile-symbol">▥</span><span><strong>火力工坊</strong><small>永久升级</small></span><b>↗</b></button></div></section>
  <nav class="home-utilities" aria-label="外观与音乐"><button id="hangar-home" aria-label="打开机库外观"><span>◈</span> 机库外观 <b>↗</b></button><button id="music-library"><span>♫</span> 星际唱片机 <b>↗</b></button></nav>
 </div>
</section>
<section id="controls" hidden aria-label="攻击操作"><div class="beat-rail"><span id="beat-label">跟着光点 · 踩点强化</span><div class="beat-dots"><i></i><i></i><i></i><i></i></div><span class="bpm">116 BPM</span></div><div class="weapon-controls"><button id="fire" class="fire" aria-label="开火，按住持续射击"><span class="fire-top">PULSE ENGINE</span><span class="fire-main">开火</span><span class="fire-bottom">点按 / 长按</span></button></div><div class="charge"><span id="charge-label">超载能量</span><div><i id="charge-fill"></i></div><b id="charge-value">0%</b></div><p id="hint">怪物自动瞄准，长按也能轻松打</p></section>
<div id="modal" class="modal" hidden><section class="panel" role="dialog" aria-modal="true" aria-label="游戏面板" id="panel"></section></div>
<div class="desktop-caption"><span>ONE BUTTON. AN ENTIRE UNIVERSE.</span><b>脉冲防线</b><p>手机竖屏 / 鼠标或空格开火</p></div>
</main>
<script type="module" src="./app.mjs?v=tutorial1"></script>
</body></html>
