name: Verify current Cocos mobile trial
on:
  push:
    paths:
      - 'trial-current/**'
      - '.github/workflows/trial-current-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live files match latest committed startup bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/trial-current"
          archive="$(grep -oE 'startup\.[0-9a-f]{12}\.bin' "$root/index.html" | head -n 1)"
          test -n "$archive"
          fallback="${archive%.bin}.js"
          test -s "$root/$archive"
          test -s "$root/$fallback"
          base="https://heitamu.github.io/pulsefront-play/trial-current"
          mkdir -p /tmp/pulsefront-current
          cd /tmp/pulsefront-current
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location "$base/index.html" -o index.html \
              && curl --fail --silent --show-error --location "$base/$archive" -o "$archive" \
              && curl --fail --silent --show-error --location "$base/$fallback" -o "$fallback" \
              && cmp -s "$root/index.html" index.html \
              && cmp -s "$root/$archive" "$archive" \
              && cmp -s "$root/$fallback" "$fallback"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          grep -q '节拍不能停' index.html
          python3 - "$archive" <<'PY'
          import gzip
          from pathlib import Path
          import sys
          content = gzip.decompress(Path(sys.argv[1]).read_bytes())
          assert len(content) > 2_000_000, "Expected complete Cocos startup payload"
          print("LIVE current build verified",sys.argv[1],len(content))
          PY
