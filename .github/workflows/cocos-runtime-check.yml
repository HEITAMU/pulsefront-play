name: Cocos C5 UI preview
on:
  push:
    branches: [cocos-runtime-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cocos-c5-ui-preview
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser preview runtime
        run: npm install --prefix /tmp/pulsefront-browser-check playwright@1.62.1
      - name: Capture current menus and cannon with real canvas input
        env:
          NODE_PATH: /tmp/pulsefront-browser-check/node_modules
          LIBGL_ALWAYS_SOFTWARE: "1"
          COCOS_QA_OUTPUT: browser-check-results/c5
          REQUIRE_NAVIGATION_ARROWS: "0"
          COCOS_QA_MENU_CAPTURE: "1"
          COCOS_QA_VIDEO: "0"
        run: xvfb-run -a node tests/cocos-retina-visual-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocos-c5-ui-preview
          path: browser-check-results
          retention-days: 7
