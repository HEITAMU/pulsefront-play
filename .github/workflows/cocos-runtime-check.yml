name: Cocos browser runtime check
on:
  push:
    branches: [cocos-runtime-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cocos-runtime-check
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test runtime
        run: npm install --prefix /tmp/pulsefront-browser-check playwright@1.62.1
      - name: Check real Cocos startup in WebKit
        env:
          NODE_PATH: /tmp/pulsefront-browser-check/node_modules
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a node tests/cocos-runtime-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocos-browser-runtime
          path: browser-check-results
          retention-days: 7
